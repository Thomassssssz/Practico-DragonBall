<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personajes de Dragon Ball</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">Personajes de Dragon Ball</h1>
    <form id="busquedaForm" class="d-flex mb-4">
    <input type="text" id="busquedaInput" class="form-control me-2" placeholder="Buscar por nombre...">
    <button class="btn btn-primary" type="submit">Buscar</button>
    </form>
    <div id="personajesContainer" class="row g-3"></div>
    <div id="loader" class="text-center my-4 d-none">
    <div class="spinner-border text-warning" role="status"></div>
    </div>
    <div id="mensaje" class="text-center mt-3 text-danger fw-bold"></div>
</div>

<div class="modal fade" id="detalleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title" id="modalNombre"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body d-flex flex-column flex-md-row align-items-center">
        <img id="modalImagen" class="img-fluid mb-3 mb-md-0 me-md-4" style="max-width: 200px;" alt="">
        <div>
            <p><strong>Raza:</strong> <span id="modalRaza"></span></p>
            <p><strong>Género:</strong> <span id="modalGenero"></span></p>
            <p><strong>Ki:</strong> <span id="modalKi"></span></p>
            <p><strong>Descripción:</strong> <span id="modalDescripcion"></span></p>
        </div>
        </div>
    </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
